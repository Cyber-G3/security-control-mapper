name: Mapper Smoke Test

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Exercise mapping CLI
        run: |
          control-map list-findings
          control-map map branch-protection-disabled --json > mapping.json
          python - <<'PY'
          import json
          data = json.load(open('mapping.json', encoding='utf-8'))
          assert data['references']
          assert data['mapping_version']
          print('Mapping smoke test passed')
          PY
      - name: Exercise coverage engine
        run: |
          cat > observations.json <<'JSON'
          {"observations":[
            {"check_id":"github.branch.protection","status":"PASS"},
            {"check_id":"github.branch.required_reviews","status":"FAIL"},
            {"check_id":"github.security.secret_scanning","status":"UNKNOWN"}
          ]}
          JSON
          control-map coverage observations.json --json > coverage.json
          python - <<'PY'
          import json
          data = json.load(open('coverage.json', encoding='utf-8'))
          assert data
          assert any(item['status'] in {'PARTIAL','GAP','UNKNOWN','SUPPORTED'} for item in data)
          print('Coverage smoke test passed')
          PY
